# Production stack: `docker compose -f docker-compose.prod.yml up -d --build`
# Reads .env next to this file (copy .env.example). PUBLIC_HOST is the host/IP browsers use.
name: agentipo

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentipo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentipo
      POSTGRES_PASSWORD: agentipo
      POSTGRES_DB: agentipo
    volumes:
      - agentipo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentipo']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    container_name: agentipo-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://agentipo:agentipo@postgres:5432/agentipo
      API_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:4000
      CORS_ORIGIN: http://${PUBLIC_HOST:-localhost}:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:4000
    container_name: agentipo-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  agentipo-pg:

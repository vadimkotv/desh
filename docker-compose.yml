services:
  postgres:
    image: postgres:16-alpine
    container_name: agentipo-postgres
    environment:
      POSTGRES_USER: agentipo
      POSTGRES_PASSWORD: agentipo
      POSTGRES_DB: agentipo
    ports:
      - '5432:5432'
    volumes:
      - agentipo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentipo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentipo-pg:
